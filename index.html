<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>ינשוף הקוסם - זיכרון קסמים</title><style>*{margin:0;box-sizing:border-box}body{background:radial-gradient(#4b2e83,#1a0f33);color:#f6e7c1;font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;touch-action:manipulation;user-select:none}h1{margin:10px;font-size:24px;color:#ffd86b}#g{display:grid;grid-template-columns:repeat(4,76px);gap:10px;margin:12px}.k{width:76px;height:96px;perspective:600px;cursor:pointer}.i{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}.k.f .i{transform:rotateY(180deg)}.a,.b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center}.a{background:linear-gradient(145deg,#7b4fd1,#3d2373);border:2px solid #ffd86b;font-size:32px}.b{background:#f6e7c1;transform:rotateY(180deg);font-size:40px;border:2px solid #b8860b}.k.m .b{background:#b7f5c4}button{background:#ffd86b;color:#2a1650;border:0;border-radius:20px;padding:10px 22px;font-size:17px;font-family:inherit;font-weight:bold;margin:8px}#h{font-size:18px}</style></head><body><h1>ינשוף הקוסם</h1><div id="h">מהלכים: <b id="mv">0</b> · זוגות: <b id="pr">0</b>/8</div><div id="g"></div><button id="r">ערבוב קסמים חדש</button>
<script>
const V=(b)=>'<svg viewBox="0 0 48 48" width="52" height="52">'+b+'</svg>';
const IC={
ball:V('<circle cx="24" cy="21" r="15" fill="#6fb6ff" stroke="#2a4d8f" stroke-width="2"/><ellipse cx="18" cy="15" rx="5" ry="3" fill="#fff" opacity=".7"/><path d="M12 38h24l-4-8H16z" fill="#8b5a2b"/><circle cx="26" cy="24" r="3" fill="#c9a0ff"/>'),
potion:V('<path d="M19 6h10v10l8 18a5 5 0 0 1-5 7H16a5 5 0 0 1-5-7l8-18z" fill="#e8f5ff" stroke="#2a4d8f" stroke-width="2"/><path d="M14 32h20l3 5a3 3 0 0 1-3 4H15a3 3 0 0 1-3-4z" fill="#3ddc84"/><rect x="18" y="4" width="12" height="5" rx="2" fill="#8b5a2b"/><circle cx="21" cy="30" r="2" fill="#fff"/>'),
wand:V('<line x1="10" y1="40" x2="32" y2="18" stroke="#5a3a1a" stroke-width="5" stroke-linecap="round"/><polygon points="34,6 36.5,13 44,13 38,17.5 40,25 34,20.5 28,25 30,17.5 24,13 31.5,13" fill="#ffd447" stroke="#b8860b"/>'),
scroll:V('<rect x="10" y="9" width="28" height="30" fill="#fff3cf" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="24" cy="9" rx="16" ry="4" fill="#e9cf8e" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="24" cy="39" rx="16" ry="4" fill="#e9cf8e" stroke="#8b5a2b" stroke-width="2"/><path d="M15 18h18M15 24h18M15 30h12" stroke="#7b4fd1" stroke-width="2"/>'),
candle:V('<rect x="17" y="20" width="14" height="22" rx="2" fill="#fff3cf" stroke="#8b5a2b" stroke-width="2"/><path d="M24 6c6 7 6 11 0 13-6-2-6-6 0-13z" fill="#ff9f1a"/><path d="M24 11c3 3 3 5 0 6-3-1-3-3 0-6z" fill="#ffe14d"/><path d="M20 24v6" stroke="#e9cf8e" stroke-width="3"/>'),
tube:V('<rect x="18" y="5" width="12" height="36" rx="6" fill="#efe6ff" stroke="#5b3aa8" stroke-width="2"/><rect x="19.5" y="22" width="9" height="17" rx="4" fill="#b565ff"/><rect x="16" y="3" width="16" height="5" rx="2" fill="#5b3aa8"/><circle cx="23" cy="28" r="2" fill="#fff"/><circle cx="26" cy="33" r="1.5" fill="#fff"/>'),
moon:V('<path d="M32 6a18 18 0 1 0 10 28A15 15 0 0 1 32 6z" fill="#ffe9a8" stroke="#b8860b" stroke-width="2"/><circle cx="20" cy="26" r="2.5" fill="#e0c36a"/><circle cx="26" cy="35" r="2" fill="#e0c36a"/>'),
star:V('<polygon points="24,4 29.5,17.5 44,18.5 33,28 36.5,42 24,34.5 11.5,42 15,28 4,18.5 18.5,17.5" fill="#ffd447" stroke="#b8860b" stroke-width="2"/>')};
const KEYS=Object.keys(IC);
const OWL='<svg viewBox="0 0 48 48" width="52" height="52"><path d="M8 8l8 6M40 8l-8 6" stroke="#ffd86b" stroke-width="4" stroke-linecap="round"/><ellipse cx="24" cy="27" rx="17" ry="17" fill="#a8743a"/><ellipse cx="24" cy="32" rx="10" ry="11" fill="#f1d9a0"/><circle cx="16" cy="22" r="8" fill="#fff6dc" stroke="#ffd86b" stroke-width="2"/><circle cx="32" cy="22" r="8" fill="#fff6dc" stroke="#ffd86b" stroke-width="2"/><circle cx="17" cy="23" r="4" fill="#2a1650"/><circle cx="31" cy="23" r="4" fill="#2a1650"/><circle cx="18" cy="21.5" r="1.3" fill="#fff"/><circle cx="32" cy="21.5" r="1.3" fill="#fff"/><path d="M21 28l3 6 3-6z" fill="#ff9f1a"/></svg>';
const S=KEYS;let a,b2,lock,mvs,prs,best=+localStorage.owlBest||0;
function init(){const d=[...S,...S].sort(()=>Math.random()-.5);g.innerHTML='';mvs=0;prs=0;a=b2=null;lock=false;mv.textContent=0;pr.textContent=0;
 d.forEach(v=>{const k=document.createElement('div');k.className='k';k.dataset.v=v;k.innerHTML='<div class="i"><div class="a">'+OWL+'</div><div class="b">'+IC[v]+'</div></div>';k.onclick=()=>flip(k);g.appendChild(k)})}
function flip(k){if(lock||k.classList.contains('f'))return;k.classList.add('f');if(!a){a=k;return}b2=k;mvs++;mv.textContent=mvs;lock=true;
 if(a.dataset.v==b2.dataset.v){a.classList.add('m');b2.classList.add('m');prs++;pr.textContent=prs;a=b2=null;lock=false;if(prs==8){if(!best||mvs<best){best=mvs;localStorage.owlBest=best}setTimeout(()=>alert('✨ הקסם הושלם ב-'+mvs+' מהלכים! שיא: '+best),500)}}
 else setTimeout(()=>{a.classList.remove('f');b2.classList.remove('f');a=b2=null;lock=false},800)}
r.onclick=init;init();
</script></body></html>
