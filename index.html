<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>ינשוף הקוסם - זיכרון קסמים</title><style>*{margin:0;box-sizing:border-box}body{background:radial-gradient(#4b2e83,#1a0f33);color:#f6e7c1;font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;touch-action:manipulation;user-select:none}h1{margin:10px;font-size:24px;color:#ffd86b}#g{display:grid;grid-template-columns:repeat(4,76px);gap:10px;margin:12px}.k{width:76px;height:96px;perspective:600px;cursor:pointer}.i{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}.k.f .i{transform:rotateY(180deg)}.a,.b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center}.a{background:linear-gradient(145deg,#7b4fd1,#3d2373);border:2px solid #ffd86b;font-size:32px}.b{background:#f6e7c1;transform:rotateY(180deg);font-size:40px;border:2px solid #b8860b}.k.m .b{background:#b7f5c4}button{background:#ffd86b;color:#2a1650;border:0;border-radius:20px;padding:10px 22px;font-size:17px;font-family:inherit;font-weight:bold;margin:8px}#h{font-size:18px}</style></head><body><h1>🦉 ינשוף הקוסם</h1><div id="h">מהלכים: <b id="mv">0</b> · זוגות: <b id="pr">0</b>/8</div><div id="g"></div><button id="r">ערבוב קסמים חדש</button>
<script>
const S=['🔮','⚗️','🪄','📜','🕯️','🧪','🌙','⭐'];let a,b2,lock,mvs,prs,best=+localStorage.owlBest||0;
function init(){const d=[...S,...S].sort(()=>Math.random()-.5);g.innerHTML='';mvs=0;prs=0;a=b2=null;lock=false;mv.textContent=0;pr.textContent=0;
 d.forEach(v=>{const k=document.createElement('div');k.className='k';k.dataset.v=v;k.innerHTML='<div class="i"><div class="a">🦉</div><div class="b">'+v+'</div></div>';k.onclick=()=>flip(k);g.appendChild(k)})}
function flip(k){if(lock||k.classList.contains('f'))return;k.classList.add('f');if(!a){a=k;return}b2=k;mvs++;mv.textContent=mvs;lock=true;
 if(a.dataset.v==b2.dataset.v){a.classList.add('m');b2.classList.add('m');prs++;pr.textContent=prs;a=b2=null;lock=false;if(prs==8){if(!best||mvs<best){best=mvs;localStorage.owlBest=best}setTimeout(()=>alert('✨ הקסם הושלם ב-'+mvs+' מהלכים! שיא: '+best),500)}}
 else setTimeout(()=>{a.classList.remove('f');b2.classList.remove('f');a=b2=null;lock=false},800)}
r.onclick=init;init();
</script></body></html>
